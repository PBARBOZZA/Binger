services:
  db:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: binger, POSTGRES_PASSWORD: binger_dev, POSTGRES_DB: binger }
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U binger"], interval: 5s, timeout: 5s, retries: 10 }
    restart: unless-stopped
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    env_file: .env
    environment: { DATABASE_URL: "postgresql://binger:binger_dev@db:5432/binger?schema=public" }
    ports: ["3001:3001"]
    depends_on: { db: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"], interval: 15s, timeout: 5s, retries: 5 }
    restart: unless-stopped
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile, args: { VITE_API_URL: "http://localhost:3001" } }
    ports: ["8080:80"]
    depends_on: { api: { condition: service_healthy } }
    restart: unless-stopped
volumes: { postgres_data: {} }
